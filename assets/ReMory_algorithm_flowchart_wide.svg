  <text class="s" x="1341" y="485">top-3 · reply·expression·risk</text>
  <path d="M1040.2,424.5 Q1057,418 1073.8,424.5 L1175.2,463.5 Q1192,470 1175.2,476.5 L1073.8,515.5 Q1057,522 1040.2,515.5 L938.8,476.5 Q922,470 938.8,463.5 Z" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.7" filter="url(#sh)"/>
  <text class="d" x="1057" y="465">⑩ LLM 이 위험을</text>
  <text class="d" x="1057" y="484">보고했는가?</text>
