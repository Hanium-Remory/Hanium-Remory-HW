      .lblT { font-size:11.5px; fill:#C9695A; text-anchor:middle; font-weight:700; paint-order:stroke; stroke:#FFF; stroke-width:4px; stroke-linejoin:round; }
      .lblN { font-size:11.5px; fill:#7E8896; text-anchor:middle; font-weight:700; paint-order:stroke; stroke:#FFF; stroke-width:4px; stroke-linejoin:round; }
