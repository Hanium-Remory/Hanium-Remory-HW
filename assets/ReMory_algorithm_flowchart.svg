<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1380" viewBox="0 0 980 1380" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9,5 L0,9.2 Z" fill="#B7BDC7"/>
    </marker>
