  <text class="sub" x="300.0" y="144">openWakeWord ONNX · 0.25초 간격 · score ≥ 0.9</text>
  <path d="M284.6,200.3 Q300,196 315.4,200.3 L454.6,239.7 Q470,244 454.6,248.3 L315.4,287.7 Q300,292 284.6,287.7 L145.4,248.3 Q130,244 145.4,239.7 Z" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300" y="239">② 방해 금지</text>
  <text class="t" x="300" y="259">시간대인가?</text>
  <rect x="150" y="330" width="300" height="58" rx="16" fill="#EAF2FD" stroke="#A8C5EC" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t"   x="300.0" y="355">③ 라이브 녹음 + VAD</text>
  <text class="sub" x="300.0" y="374">30ms 프레임 · webrtcvad + RMS 에너지 게이트</text>
  <rect x="560" y="330" width="340" height="58" rx="16" fill="#EAF6EF" stroke="#A2D2BA" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="t"   x="730.0" y="355">③-1 감정 샘플링 (병행)</text>
  <text class="sub" x="730.0" y="374">0.7초 간격 캡처 → 즉시 분류 후 프레임 폐기</text>
  <path d="M284.6,432.3 Q300,428 315.4,432.3 L454.6,471.7 Q470,476 454.6,480.3 L315.4,519.7 Q300,524 284.6,519.7 L145.4,480.3 Q130,476 145.4,471.7 Z" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300" y="471">④ 말끝 침묵이</text>
  <text class="t" x="300" y="491">2초 이어졌는가?</text>
  <path d="M284.6,564.3 Q300,560 315.4,564.3 L454.6,603.7 Q470,608 454.6,612.3 L315.4,651.7 Q300,656 284.6,651.7 L145.4,612.3 Q130,608 145.4,603.7 Z" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300" y="603">⑤ 15초 동안</text>
  <text class="t" x="300" y="623">발화가 없었는가?</text>
  <rect x="150" y="710" width="300" height="58" rx="16" fill="#EAF6EF" stroke="#A2D2BA" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t"   x="300.0" y="735">⑥ STT (Hailo Whisper-base)</text>
  <text class="sub" x="300.0" y="754">무음 트리밍 · 0.4초 미만·한글 없음 → 폐기</text>
  <path d="M284.6,806.3 Q300,802 315.4,806.3 L454.6,845.7 Q470,850 454.6,854.3 L315.4,893.7 Q300,898 284.6,893.7 L145.4,854.3 Q130,850 145.4,845.7 Z" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300" y="845">⑦ 규칙(safety.py)에</text>
  <text class="t" x="300" y="865">위험 표현이 걸리는가?</text>
  <rect x="150" y="934" width="300" height="58" rx="16" fill="#F0EAFB" stroke="#BFAEE6" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t"   x="300.0" y="959">⑨ RAG 검색(top-3) → LLM</text>
  <text class="sub" x="300.0" y="978">reply · expression · risk 를 JSON 으로 동시 생성</text>
  <path d="M284.6,1038.3 Q300,1034 315.4,1038.3 L454.6,1077.7 Q470,1082 454.6,1086.3 L315.4,1125.7 Q300,1130 284.6,1125.7 L145.4,1086.3 Q130,1082 145.4,1077.7 Z" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300" y="1077">⑩ LLM 이 위험을</text>
  <text class="t" x="300" y="1097">보고했는가?</text>
  <rect x="600" y="986" width="300" height="58" rx="16" fill="#FCE7E4" stroke="#EE9285" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t"   x="750.0" y="1011">⑧ 정해진 문장으로 응답</text>
  <text class="sub" x="750.0" y="1030">LLM 우회 · 가족에게 즉시 알림</text>
  <rect x="150" y="1166" width="300" height="58" rx="16" fill="#E7F4EE" stroke="#93C9AC" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t"   x="300.0" y="1191">⑪ TTS 스트리밍 재생 + 표정</text>
  <text class="sub" x="300.0" y="1210">가족 목소리 화자 지정 · LCD 표정 동기</text>
  <rect x="150" y="1276" width="300" height="46" rx="23" fill="#FDECEA" stroke="#F0A99C" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300.0" y="1305">다음 턴</text>
