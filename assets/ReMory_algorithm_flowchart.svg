  <rect x="150" y="20" width="300" height="46" rx="23" fill="#FDECEA" stroke="#F0A99C" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="300.0" y="49">대화 시작</text>
  <rect x="150" y="100" width="300" height="58" rx="16" fill="#EAF2FD" stroke="#A8C5EC" stroke-width="1.6" filter="url(#sh)"/>
