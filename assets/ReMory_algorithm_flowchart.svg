      .sub  { font-size:11.5px; fill:#8A93A0; text-anchor:middle; font-weight:500; }
      .lblF { font-size:11.5px; fill:#8A93A0; text-anchor:middle; font-weight:600; paint-order:stroke; stroke:#FFFFFF; stroke-width:4px; stroke-linejoin:round; }
      .lblT { font-size:11.5px; fill:#C9695A; text-anchor:middle; font-weight:600; paint-order:stroke; stroke:#FFFFFF; stroke-width:4px; stroke-linejoin:round; }
      .lblN { font-size:11.5px; fill:#7E8896; text-anchor:middle; font-weight:600; paint-order:stroke; stroke:#FFFFFF; stroke-width:4px; stroke-linejoin:round; }
