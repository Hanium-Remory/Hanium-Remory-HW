<svg xmlns="http://www.w3.org/2000/svg" width="980" height="490" viewBox="0 0 980 490" font-family="Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0.8 L9,5 L0,9.2 Z" fill="#B7BDC7"/>
    </marker>
    <filter id="sh" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7C8698" flood-opacity="0.15"/>
    </filter>
    <style>
      .ln  { fill:none; stroke:#B7BDC7; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#ah); }
      .ln0 { fill:none; stroke:#B7BDC7; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .h   { font-size:14.5px; fill:#39404D; font-weight:700; }
      .t   { font-size:14px; fill:#39404D; text-anchor:middle; font-weight:700; }
      .tl  { font-size:13.5px; fill:#39404D; font-weight:700; }
      .s   { font-size:11.5px; fill:#8A93A0; text-anchor:middle; font-weight:500; }
      .sl  { font-size:11.5px; fill:#8A93A0; font-weight:500; }
      .num { font-size:10px; fill:#8A93A0; text-anchor:middle; font-weight:600; }
      .rst { font-size:10px; fill:#C9695A; text-anchor:middle; font-weight:800; }
      .hld { font-size:10px; fill:#5B8FCB; text-anchor:middle; font-weight:800; }
      .res { font-size:12.5px; fill:#39404D; font-weight:600; }
      .cap { font-size:11.5px; fill:#8A93A0; text-anchor:middle; font-weight:600; }
      .tag { font-size:10px; fill:#FFFFFF; text-anchor:middle; font-weight:700; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect x="30" y="178" width="170" height="62" rx="14" fill="#F1F3F6" stroke="#D7DCE3" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="115.0" y="205">어르신 발화</text>
  <text class="s" x="115.0" y="224">STT 결과 문장</text>
  <rect x="240" y="150" width="220" height="78" rx="14" fill="#EAF6EF" stroke="#A2D2BA" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="350.0" y="185">① 규칙 판별</text>
  <text class="s" x="350.0" y="204">정규식 5종 · 네트워크와 무관 · LLM 호출 전</text>
  <rect x="240" y="300" width="220" height="78" rx="14" fill="#F0EAFB" stroke="#BFAEE6" stroke-width="1.6" filter="url(#sh)"/>
  <text class="t" x="350.0" y="335">② LLM 판별</text>
  <text class="s" x="350.0" y="354">대화 생성 호출의 risk 필드 · 왕복 없음</text>
  <path class="ln" d="M200,209 L210.0,209.0 Q220,209 220.0,199.0 L220.0,199.0 Q220,189 230.0,189.0 L240,189"/>
  <path class="ln" d="M350,228 L350,300"/>
  <text class="sl" x="362" y="270" font-size="11.5">안 걸림</text>
  <path class="ln0" d="M460,189 L505,189"/>
  <text class="sl" x="466" y="179" font-size="11.5">걸림</text>
  <path class="ln0" d="M460,339 L505,339"/>
  <path class="ln0" d="M505,123 L505,423"/>
  <rect x="560" y="96" width="390" height="54" rx="14" fill="#FCE7E4" stroke="#EE9285" stroke-width="1.6" filter="url(#sh)"/>
  <text class="tl" x="584" y="119">자해</text>
  <text class="sl" x="584" y="137">LLM 을 거치지 않고 고정 응답 · 가족에게 즉시 알림</text>
  <rect x="878" y="112" width="54" height="21" rx="10.5" fill="#D9705F"/>
  <text class="tag" x="905" y="127">최우선</text>
  <path class="ln" d="M505,123 L560,123"/>
  <rect x="560" y="162" width="390" height="54" rx="14" fill="#FDECEA" stroke="#F0A99C" stroke-width="1.6" filter="url(#sh)"/>
  <text class="tl" x="584" y="185">타해</text>
  <text class="sl" x="584" y="203">야단치지 않고 고정 응답으로 진정 · 기록</text>
  <path class="ln" d="M505,189 L560,189"/>
  <rect x="560" y="228" width="390" height="54" rx="14" fill="#FDF7E7" stroke="#E8CE86" stroke-width="1.6" filter="url(#sh)"/>
  <text class="tl" x="584" y="251">의료</text>
  <text class="sl" x="584" y="269">판단하지 않고 가족·의사에게 넘김</text>
  <path class="ln" d="M505,255 L560,255"/>
  <rect x="560" y="294" width="390" height="54" rx="14" fill="#EAF2FD" stroke="#A8C5EC" stroke-width="1.6" filter="url(#sh)"/>
  <text class="tl" x="584" y="317">학대</text>
  <text class="sl" x="584" y="335">기록만 남김 (실시간 알림 없음)</text>
  <path class="ln" d="M505,321 L560,321"/>
  <rect x="560" y="360" width="390" height="54" rx="14" fill="#F1F3F6" stroke="#D7DCE3" stroke-width="1.6" filter="url(#sh)"/>
  <text class="tl" x="584" y="383">거친 말</text>
  <text class="sl" x="584" y="401">훈계하지 않고 LLM 에 지침만 얹음 · 횟수 기록</text>
  <path class="ln" d="M505,387 L560,387"/>
  <text class="cap" x="755" y="444">규칙이 잡았든 LLM 이 잡았든, 그다음 대응은 같다</text>
  <text class="sl" x="30" y="438">※ 한 문장에 여러 종류가 섞이면</text>
  <text class="sl" x="30" y="458">　 자해를 가장 먼저 본다.</text>
  <text class="sl" x="270" y="438">※ 거친 말은 규칙만 판정한다 — 모델에</text>
  <text class="sl" x="270" y="458">　 맡기면 기준이 그때그때 달라진다.</text>
</svg>
